{% assign repo = include.repo %}

{% assign pages = site.pages
                  | where_exp:"p","p.path contains repo"
                  | where_exp:"p","p.extname == '.md'"
                  | reject:"name","README.md"
                  | reject:"name","index.md" %}

<nav>
  <ul>
    <li><a href="/{{ repo }}/">Home</a></li>
    {% for p in pages %}
      <li><a href="{{ p.url | relative_url }}">{{ p.basename }}</a></li>
    {% endfor %}
  </ul>
</nav>
