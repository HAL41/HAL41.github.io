<nav>
  <!-- Home link line -->
  <p class="nav-line nav-top">
    <strong><a href="/">Home</a></strong>
  </p>
  <!-- Repositories list -->
  {% for repo_name in site.data.repos %}
    <p class="nav-line nav-top">
      <strong><a href="/r/{{ repo_name }}/">{{ repo_name }}</a></strong> 
    </p>
    {% if include.repo == repo_name %}
      <!-- Custom nav for each repo -->
      {% if include.repo == "AI-Insights" %}
        {% include nav-ai-insights.html repo=include.repo %}
      {% endif %}
    {% endif %}
  {% endfor %}
</nav>
