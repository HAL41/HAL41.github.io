{% assign segments = page.url | split: "/" | reject: "" %}
{% assign repo     = segments[0] %}

<!DOCTYPE html>
<html lang="en">
<head> … 
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      {% include nav.html repo="AI-Insights" %}
    </aside>

    <main class="content">
      {%- if page.extname == ".html" and page.path ends_with: "README.md" == false -%}
        {{ content | markdownify }}
      {%- else -%}
        {{ content }}
      {%- endif -%}
    </main>
  </div>
</body>
</html>
