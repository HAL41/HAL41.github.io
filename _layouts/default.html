{% assign repo_from_url = page.url | split: "/" | reject: "" | first %}
{% assign repo = page.repo | default: repo_from_url %}

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
        {% include nav.html repo=repo %}
    </aside>

    <main class="main">
      <div class="content">
        {{ content }}
      </div>
    </main>
  </div>
</body>
</html>
